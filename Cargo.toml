[package]
name = "ferrum-app-intelligence"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
description = "Questions about certified metrics answered with the asker's own rights, with the plan followed and the evidence behind it; proposals that start ordinary reviewed processes"
repository = "https://github.com/CBFerrum/ferrum-app-intelligence"
build = "build.rs"

[dependencies]
ferrum-kernel = { git = "https://github.com/CBFerrum/Ferrum", branch = "main" }
ferrum-meta = { git = "https://github.com/CBFerrum/Ferrum", branch = "main" }
ferrum-domain = { git = "https://github.com/CBFerrum/Ferrum", branch = "main" }
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
serde_json = "1"

[dev-dependencies]
ferrum-app-metrics = { git = "https://github.com/CBFerrum/ferrum-app-metrics", branch = "main" }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "uuid", "chrono", "rust_decimal", "json", "migrate", "macros"] }
tokio = { version = "1.45", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
uuid = { version = "1.10", features = ["v4", "v7", "serde"] }

[lints.clippy]
type_complexity = "allow"

[profile.dev]
debug = "line-tables-only"
