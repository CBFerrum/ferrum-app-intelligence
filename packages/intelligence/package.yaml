package: intelligence
version: 0.2.0
label: Intelligence
description: "Questions about certified metrics, answered with the asker's own rights, with the plan followed and the evidence behind it"
depends: [core, metrics]

modules:
  - name: intelligence
    label: Intelligence
    icon: sparkles
    order: 63
    items: [Question, Example]

roles:
  - name: Intelligence User
    description: Asks about the certified metrics they may read, and sees the questions they asked.
    permissions:
      - {entity: Question, read: true, if_owner: true}
      - {entity: Example, read: true, create: true, if_owner: true}
  - name: Intelligence Steward
    description: Reviews the examples people propose, and accepts those that say what a phrase means here. Never their own.
    permissions:
      - {entity: Example, read: true, write: true}

personal_data:
  - {entity: Question, match: asked_by, erase: [question, answer, plan, reason]}
